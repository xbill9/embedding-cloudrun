# Remote build for images too large for local disk (the L4 image is ~12 GB).
#   gcloud builds submit --config cloudbuild.yaml --substitutions _IMAGE=...,_MODEL=original,_TORCH_INDEX=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - "MODEL=${_MODEL}"
      - --build-arg
      - "TORCH_INDEX=${_TORCH_INDEX}"
      - -t
      - "${_IMAGE}"
      - .
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
